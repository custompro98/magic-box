<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Magic Color Box</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <!-- Prebuilt Tailwind CSS is included locally so this page works offline. -->
    <link rel="stylesheet" href="./vendor/tailwind.min.css">
    <style>
        /* Using a fun, kid-friendly font stack */
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 2px, transparent 2px);
            background-size: 40px 40px;
        }
        
        /* Adding a smooth transition for the magic box color change */
        #magic-box {
            position: relative;
            transition: background-color 0.5s ease, transform 0.2s ease;
        }

        #magic-box[data-shape="circle"] {
            border-radius: 50%;
        }

        #magic-box[data-shape="star"] {
            border: 0;
            border-radius: 0;
            box-shadow: none;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        #star-outline {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #magic-box[data-shape="star"] #star-outline {
            display: block;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Main Container -->
    <div class="bg-white p-8 sm:p-12 rounded-3xl shadow-2xl max-w-5xl w-full border-8 border-yellow-300 text-center">
        
        <h1 class="text-4xl sm:text-5xl font-black text-purple-600 mb-2 drop-shadow-md">
            The Magic Box!
        </h1>
        <p class="text-xl text-gray-500 mb-8 font-bold">Tell the computer what to do!</p>

        <!-- The Box that will change color and shape -->
        <div id="magic-box" data-shape="square" role="img" aria-label="Square" class="w-48 h-48 sm:w-64 sm:h-64 mx-auto border-8 border-dashed border-gray-300 rounded-3xl mb-10 flex items-center justify-center bg-gray-100 shadow-inner">
            <!-- Clipping half of this 16px stroke leaves an 8px dashed border inside the star. -->
            <svg id="star-outline" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                <polygon points="50,0 61,35 98,35 68,57 79,91 50,70 21,91 32,57 2,35 39,35" fill="none" stroke="#d1d5db" stroke-width="16" stroke-dasharray="24 16" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
            </svg>
            <span id="box-text" class="text-6xl opacity-30 text-gray-500 font-black">?</span>
        </div>

        <!-- Forms sit side by side when there is room, and stack on small screens. -->
        <div class="grid items-start gap-8 md:grid-cols-2 md:gap-10">
            <form id="color-form" class="min-w-0 flex flex-col gap-6">
                <div class="flex flex-col gap-2">
                    <label for="color-input" class="text-3xl font-bold text-blue-600">
                        Type a color:
                    </label>
                    <!-- Large text input for easy reading -->
                    <input
                        type="text"
                        id="color-input"
                        class="min-w-0 w-full text-4xl md:text-2xl lg:text-4xl text-center p-4 rounded-2xl border-4 border-blue-300 focus:border-purple-500 focus:outline-none focus:ring-4 focus:ring-purple-200"
                        placeholder="red, blue, pink..."
                        aria-describedby="color-options"
                        autocomplete="off"
                        required
                    >
                    <p id="color-options" class="text-lg text-gray-500">Try red, blue, or rainbow.</p>
                </div>

                <!-- Big, playful submit button -->
                <button
                    type="submit"
                    class="bg-pink-500 hover:bg-pink-400 text-white text-3xl sm:text-4xl md:text-2xl lg:text-3xl font-black py-5 px-8 md:px-4 lg:px-8 rounded-2xl shadow-lg transform transition active:scale-95 active:translate-y-2 border-b-8 border-pink-700 hover:border-pink-600"
                >
                    Change Color! ✨
                </button>
            </form>

            <!-- Pick a shape by typing its name, just like picking a color. -->
            <form id="shape-form" class="min-w-0 flex flex-col gap-6">
                <div class="flex flex-col gap-2">
                    <label for="shape-input" class="text-3xl font-bold text-blue-600">
                        Type a shape:
                    </label>
                    <input
                        type="text"
                        id="shape-input"
                        class="min-w-0 w-full text-4xl md:text-2xl lg:text-4xl text-center p-4 rounded-2xl border-4 border-blue-300 focus:border-purple-500 focus:outline-none focus:ring-4 focus:ring-purple-200"
                        placeholder="circle, star..."
                        aria-describedby="shape-options shape-status"
                        autocomplete="off"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                    >
                    <p id="shape-options" class="text-lg text-gray-500">Try square, circle, or star.</p>
                </div>
                <div class="flex flex-col gap-2">
                    <button
                        type="submit"
                        id="shape-button"
                        aria-controls="magic-box"
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white text-2xl sm:text-3xl md:text-2xl lg:text-3xl font-black py-5 px-8 md:px-4 lg:px-8 rounded-2xl shadow-lg transform transition active:scale-95 active:translate-y-2 border-b-8 border-blue-800 hover:border-blue-700 focus-visible:outline focus-visible:outline-4 focus-visible:outline-offset-4 focus-visible:outline-blue-600"
                    >
                        Change Shape!
                    </button>
                </div>
            </form>
        </div>

    </div>

    <!-- The JavaScript Code that does the "Magic" -->
    <script>
        // 1. We tell the computer to find our important pieces on the page
        const form = document.getElementById('color-form');
        const input = document.getElementById('color-input');
        const magicBox = document.getElementById('magic-box');
        const boxText = document.getElementById('box-text');
        const shapeForm = document.getElementById('shape-form');
        const shapeInput = document.getElementById('shape-input');
        const shapeStatus = document.getElementById('shape-status');
        const shapes = ['square', 'circle', 'star'];

        // Clear any previous spelling error as soon as the user edits the shape.
        shapeInput.addEventListener('input', function() {
            shapeInput.setCustomValidity('');
        });

        // Change to the shape the user typed, without changing its color.
        shapeForm.addEventListener('submit', function(event) {
            event.preventDefault();
            const newShape = shapeInput.value.trim().toLowerCase();

            if (!shapes.includes(newShape)) {
                shapeInput.setCustomValidity('Please type square, circle, or star.');
                shapeInput.reportValidity();
                return;
            }

            const shapeName = newShape.charAt(0).toUpperCase() + newShape.slice(1);
            magicBox.dataset.shape = newShape;
            magicBox.setAttribute('aria-label', shapeName);
            shapeInput.value = '';
            shapeInput.focus();
        });

        // 2. We listen for when the user clicks the "Change Color!" button
        form.addEventListener('submit', function(event) {
            // Stop the page from reloading (which is what forms normally do)
            event.preventDefault(); 

            // 3. We get the magic word (the color) the user typed
            const newColor = input.value.trim();

            if (newColor !== '') {
                // 4. We tell the computer to change the background color of the box!
                if (newColor.toLowerCase() === 'rainbow') {
                    magicBox.style.backgroundImage = 'linear-gradient(180deg, red, orange, yellow, green, blue, indigo, violet 90%)';
                } else {
                    // Clear the rainbow when a solid color is chosen again.
                    magicBox.style.backgroundImage = '';
                    magicBox.style.backgroundColor = newColor;
                }
                
                // Hide the question mark once a color is chosen
                boxText.style.display = 'none';

                // Give the box a fun little bounce effect
                magicBox.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    magicBox.style.transform = 'scale(1)';
                }, 200);
            }

            // 5. Clear the input so it's ready for the next color!
            input.value = '';
            // Put the blinking cursor back in the box
            input.focus(); 
        });
    </script>
</body>
</html>
